{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="premium-card">
            <div class="text-center mb-4">
                <i class="bi bi-search text-primary" style="font-size: 3rem;"></i>
                <h2 class="page-header mt-2">Discover Talent</h2>
                <p class="text-muted">Find the perfect students for your upcoming events</p>
            </div>
            
            <form action="{% url 'results' %}" method="get">
                <div class="mb-4">
                    <label class="form-label fw-bold">Primary Skill (Required)</label>
                    <select name="skill_id" class="form-select form-select-lg" required>
                        <option value="">-- Select a Skill --</option>
                        {% regroup skills by category as skill_list %}
                        {% for category in skill_list %}
                            <optgroup label="{{ category.grouper }}">
                            {% for skill in category.list %}
                                <option value="{{ skill.id }}">{{ skill.name }}</option>
                            {% endfor %}
                            </optgroup>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Department (Optional)</label>
                        <input type="text" name="department" class="form-control" placeholder="e.g. Computer Science">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Year (Optional)</label>
                        <input type="text" name="year" class="form-control" placeholder="e.g. 3">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="bi bi-search me-2"></i> Search Students
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
