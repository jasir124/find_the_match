{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="premium-card text-center">
            <h2 class="page-header mb-4">Welcome Back</h2>
            <p class="text-muted mb-4">Login to your talent dashboard</p>
            <form method="post" class="text-start">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-3 py-2">Login</button>
            </form>
            <div class="mt-4">
                <p class="text-muted small">Don't have an account? <a href="{% url 'register' %}" class="text-primary text-decoration-none fw-semibold">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
